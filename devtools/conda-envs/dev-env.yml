name: mupt-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Basic Python dependencies
  - python>=3.12,<3.14  # <3.14 because of https://github.com/openforcefield/openff-units/pull/178
  - pip
  - jupyterlab

  # Linting and formatting
  - ruff
  - pre-commit

  # Unit testing
  - pytest
  - pytest-cov
  - codecov
  - nbval

  # Mathematics and scientific computing
  - numpy
  - scipy>=1.16.0 # required to allow use of RigidTransform
  - sympy

  # Graphs
  - anytree
  - networkx

  # Visualization
  - rich
  - matplotlib
  - ipympl

  # Chemistry
  - rdkit
  - periodictable

  # Molecular Dynamics toolkits
  ## Visualization
  - py3Dmol
  - openbabel>=3.0

  ## OpenFF
  - openff-toolkit>=0.18
  - openff-interchange>=0.5
  - openff-nagl-models

  ## HOOMD
  - hoomd>=5.3.0
  - gsd>=3.0
  - freud>=3.0
  - fresnel

  ## MoSDeF
  # - mbuild>=1.0 # DEV: dependencies and env solve really don't play nice w/ OpenFF - hiding for now, since unused in code + examples
  - gmso

  ## Analysis
  - mdanalysis

  - pip:
    - build
    - twine
