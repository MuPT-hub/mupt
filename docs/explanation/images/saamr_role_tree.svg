<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SAAMR roles versus tree depth</title>
  <desc id="d">Two Primitive trees. Left: a strict SAAMR tree where UNIVERSE, SEGMENT, RESIDUE and PARTICLE sit at depths 0 to 3. Right: the same system with an UNASSIGNED domain node inserted, pushing atoms to depth 4; exporters look through the domain node.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .edge { stroke: #6b7280; stroke-width: 1.5; }
      .axis { fill: #6b7280; font-size: 12px; }
      .rule { stroke: #e5e7eb; stroke-width: 1; }
      .title { fill: #111827; font-size: 15px; font-weight: bold; }
      .note { fill: #374151; font-size: 12px; }
      .code { font-family: Menlo, Consolas, monospace; }
      .lbl { fill: #111827; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .role { font-size: 10px; font-weight: bold; letter-spacing: 0.5px; text-anchor: middle; }
      .universe rect { fill: #e8ebf7; stroke: #3f4f9a; }  .universe .role { fill: #3f4f9a; }
      .segment  rect { fill: #e3f2ee; stroke: #22705f; }  .segment  .role { fill: #22705f; }
      .residue  rect { fill: #fbeede; stroke: #9a5212; }  .residue  .role { fill: #9a5212; }
      .particle rect { fill: #f1e9f7; stroke: #6c3f92; }  .particle .role { fill: #6c3f92; }
      .unassigned rect { fill: #f9fafb; stroke: #6b7280; stroke-dasharray: 5 4; }
      .unassigned .role { fill: #6b7280; }
      rect { stroke-width: 1.6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="420" rx="10"/>

  <!-- depth axis -->
  <g>
    <line class="rule" x1="60" y1="70" x2="805" y2="70"/>
    <line class="rule" x1="60" y1="140" x2="805" y2="140"/>
    <line class="rule" x1="60" y1="210" x2="805" y2="210"/>
    <line class="rule" x1="60" y1="280" x2="805" y2="280"/>
    <line class="rule" x1="60" y1="350" x2="805" y2="350"/>
    <text class="axis" x="14" y="74">depth 0</text>
    <text class="axis" x="14" y="144">depth 1</text>
    <text class="axis" x="14" y="214">depth 2</text>
    <text class="axis" x="14" y="284">depth 3</text>
    <text class="axis" x="14" y="354">depth 4</text>
  </g>

  <text class="title" x="240" y="30" text-anchor="middle">Strict SAAMR depth</text>
  <text class="title" x="620" y="30" text-anchor="middle">With a transparent grouping node</text>

  <!-- ===== left tree ===== -->
  <g>
    <line class="edge" x1="240" y1="90" x2="240" y2="120"/>
    <line class="edge" x1="240" y1="160" x2="170" y2="190"/>
    <line class="edge" x1="240" y1="160" x2="310" y2="190"/>
    <line class="edge" x1="170" y1="230" x2="135" y2="260"/>
    <line class="edge" x1="170" y1="230" x2="205" y2="260"/>
    <line class="edge" x1="310" y1="230" x2="275" y2="260"/>
    <line class="edge" x1="310" y1="230" x2="345" y2="260"/>
  </g>
  <g class="universe"><rect x="184" y="50" width="112" height="40" rx="6"/><text class="lbl" x="240" y="67">universe</text><text class="role" x="240" y="82">UNIVERSE</text></g>
  <g class="segment"><rect x="184" y="120" width="112" height="40" rx="6"/><text class="lbl" x="240" y="137">chain</text><text class="role" x="240" y="152">SEGMENT</text></g>
  <g class="residue"><rect x="120" y="190" width="100" height="40" rx="6"/><text class="lbl" x="170" y="207">monomer 1</text><text class="role" x="170" y="222">RESIDUE</text></g>
  <g class="residue"><rect x="260" y="190" width="100" height="40" rx="6"/><text class="lbl" x="310" y="207">monomer 2</text><text class="role" x="310" y="222">RESIDUE</text></g>
  <g class="particle"><rect x="103" y="260" width="64" height="40" rx="6"/><text class="lbl" x="135" y="277">C</text><text class="role" x="135" y="292">PARTICLE</text></g>
  <g class="particle"><rect x="173" y="260" width="64" height="40" rx="6"/><text class="lbl" x="205" y="277">H</text><text class="role" x="205" y="292">PARTICLE</text></g>
  <g class="particle"><rect x="243" y="260" width="64" height="40" rx="6"/><text class="lbl" x="275" y="277">C</text><text class="role" x="275" y="292">PARTICLE</text></g>
  <g class="particle"><rect x="313" y="260" width="64" height="40" rx="6"/><text class="lbl" x="345" y="277">H</text><text class="role" x="345" y="292">PARTICLE</text></g>
  <text class="note" x="240" y="385" text-anchor="middle">all leaves at depth 3:</text>
  <text class="note code" x="240" y="402" text-anchor="middle">assign_SAAMR_roles() can label it</text>

  <!-- ===== right tree ===== -->
  <g>
    <line class="edge" x1="620" y1="90" x2="620" y2="120"/>
    <line class="edge" x1="620" y1="160" x2="620" y2="190"/>
    <line class="edge" x1="620" y1="230" x2="550" y2="260"/>
    <line class="edge" x1="620" y1="230" x2="690" y2="260"/>
    <line class="edge" x1="550" y1="300" x2="515" y2="330"/>
    <line class="edge" x1="550" y1="300" x2="585" y2="330"/>
    <line class="edge" x1="690" y1="300" x2="655" y2="330"/>
    <line class="edge" x1="690" y1="300" x2="725" y2="330"/>
  </g>
  <g class="universe"><rect x="564" y="50" width="112" height="40" rx="6"/><text class="lbl" x="620" y="67">universe</text><text class="role" x="620" y="82">UNIVERSE</text></g>
  <g class="unassigned"><rect x="564" y="120" width="112" height="40" rx="6"/><text class="lbl" x="620" y="137">domain</text><text class="role" x="620" y="152">UNASSIGNED</text></g>
  <g class="segment"><rect x="564" y="190" width="112" height="40" rx="6"/><text class="lbl" x="620" y="207">chain</text><text class="role" x="620" y="222">SEGMENT</text></g>
  <g class="residue"><rect x="500" y="260" width="100" height="40" rx="6"/><text class="lbl" x="550" y="277">monomer 1</text><text class="role" x="550" y="292">RESIDUE</text></g>
  <g class="residue"><rect x="640" y="260" width="100" height="40" rx="6"/><text class="lbl" x="690" y="277">monomer 2</text><text class="role" x="690" y="292">RESIDUE</text></g>
  <g class="particle"><rect x="483" y="330" width="64" height="40" rx="6"/><text class="lbl" x="515" y="347">C</text><text class="role" x="515" y="362">PARTICLE</text></g>
  <g class="particle"><rect x="553" y="330" width="64" height="40" rx="6"/><text class="lbl" x="585" y="347">H</text><text class="role" x="585" y="362">PARTICLE</text></g>
  <g class="particle"><rect x="623" y="330" width="64" height="40" rx="6"/><text class="lbl" x="655" y="347">C</text><text class="role" x="655" y="362">PARTICLE</text></g>
  <g class="particle"><rect x="693" y="330" width="64" height="40" rx="6"/><text class="lbl" x="725" y="347">H</text><text class="role" x="725" y="362">PARTICLE</text></g>
  <text class="note" x="620" y="385" text-anchor="middle">leaves at depth 4: roles set by hand;</text>
  <text class="note" x="620" y="402" text-anchor="middle">exporters look through "domain"</text>
</svg>
