<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Connector anatomy and antialignment</title>
  <desc id="d">Left: a Connector belongs to a body and has two attachment points, an anchor on the body and a linker off the body; the bond vector points from anchor to linker. Right: two bodies are connected when their Connectors are antialigned, meaning each Connector's anchor coincides with the other Connector's linker. Rigid antialignment moves one whole body; ballistic antialignment keeps both bodies fixed and stretches the bond.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #111827; font-size: 15px; font-weight: bold; }
      .note { fill: #374151; font-size: 12px; }
      .small { fill: #374151; font-size: 11px; }
      .code { font-family: Menlo, Consolas, monospace; }
      .bodyA { fill: #e3f2ee; stroke: #22705f; stroke-width: 1.6; }
      .bodyB { fill: #fbeede; stroke: #9a5212; stroke-width: 1.6; }
      .anchor { fill: #3f4f9a; }
      .linker { fill: #ffffff; stroke: #6c3f92; stroke-width: 2.2; }
      .linkerRing { fill: none; stroke: #6c3f92; stroke-width: 2.2; }
      .vecA { stroke: #22705f; stroke-width: 2.2; }
      .vecB { stroke: #9a5212; stroke-width: 2.2; }
      .lblA { fill: #22705f; font-size: 12px; font-weight: bold; }
      .lblB { fill: #9a5212; font-size: 12px; font-weight: bold; }
      .anchorTxt { fill: #3f4f9a; font-size: 12px; font-weight: bold; }
      .linkerTxt { fill: #6c3f92; font-size: 12px; font-weight: bold; }
      .divider { stroke: #e5e7eb; stroke-width: 1; }
    </style>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22705f"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a5212"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="360" rx="10"/>
  <line class="divider" x1="330" y1="20" x2="330" y2="340"/>

  <!-- ===== left: anatomy ===== -->
  <text class="title" x="165" y="32" text-anchor="middle">One Connector</text>
  <ellipse class="bodyA" cx="105" cy="160" rx="70" ry="55"/>
  <text class="lblA" x="80" y="164" text-anchor="middle">body A</text>
  <line class="vecA" x1="160" y1="160" x2="245" y2="160" marker-end="url(#arrA)"/>
  <circle class="anchor" cx="160" cy="160" r="7"/>
  <circle class="linker" cx="255" cy="160" r="8"/>
  <text class="anchorTxt" x="160" y="140" text-anchor="middle">anchor</text>
  <text class="small" x="160" y="196" text-anchor="middle">on the body</text>
  <text class="linkerTxt" x="255" y="140" text-anchor="middle">linker</text>
  <text class="small" x="255" y="196" text-anchor="middle">where a neighbor</text>
  <text class="small" x="255" y="210" text-anchor="middle">should sit</text>
  <text class="small" x="207" y="178" text-anchor="middle">bond vector</text>
  <text class="note" x="30" y="262">Each attachment point has a position and</text>
  <text class="note" x="30" y="278">a set of markers that decide which</text>
  <text class="note" x="30" y="294">Connectors may bond (<tspan class="code">bondable_with</tspan>).</text>
  <text class="note" x="30" y="316">Free: no neighbor yet. Bound: has one.</text>

  <!-- ===== right: antialigned pair ===== -->
  <text class="title" x="575" y="32" text-anchor="middle">Two antialigned Connectors = one bond</text>
  <ellipse class="bodyA" cx="440" cy="160" rx="70" ry="55"/>
  <text class="lblA" x="420" y="164" text-anchor="middle">body A</text>
  <ellipse class="bodyB" cx="710" cy="160" rx="70" ry="55"/>
  <text class="lblB" x="730" y="164" text-anchor="middle">body B</text>
  <!-- A: anchor at 495, linker at 655 (= B anchor) -->
  <line class="vecA" x1="495" y1="150" x2="645" y2="150" marker-end="url(#arrA)"/>
  <!-- B: anchor at 655, linker at 495 (= A anchor) -->
  <line class="vecB" x1="655" y1="170" x2="505" y2="170" marker-end="url(#arrB)"/>
  <circle class="anchor" cx="495" cy="160" r="7"/>
  <circle class="anchor" cx="655" cy="160" r="7"/>
  <circle class="linkerRing" cx="495" cy="160" r="12"/>
  <circle class="linkerRing" cx="655" cy="160" r="12"/>
  <text class="lblA" x="575" y="140" text-anchor="middle">A: anchor → linker</text>
  <text class="lblB" x="575" y="192" text-anchor="middle">B: anchor → linker</text>
  <text class="note" x="575" y="236" text-anchor="middle">A's anchor sits on B's linker, and vice versa</text>
  <text class="note" x="575" y="252" text-anchor="middle">(<tspan class="code">a.is_antialigned(b)</tspan> is True)</text>

  <text class="note" x="360" y="294"><tspan font-weight="bold">Rigid</tspan>: rotate + translate one body (and all it carries) onto the other.</text>
  <text class="note" x="360" y="316"><tspan font-weight="bold">Ballistic</tspan>: keep both bodies fixed; aim each linker at the other anchor.</text>
</svg>
